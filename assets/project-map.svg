<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Four engineering problem spaces</title>
<desc id="desc">A dark engineering map connecting MediBot RAG, LoanRisk AI, AccessGuard, and Fake News Intelligence through evidence, interpretability, and dependable systems.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111a22"/><stop offset="1" stop-color="#080c10"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a6f17b"/><stop offset="1" stop-color="#4ac6b7"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#26333b" stroke-width="1"/></pattern>
</defs>
<rect width="1200" height="300" rx="16" fill="url(#bg)"/>
<rect width="1200" height="300" rx="16" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="298" rx="15" fill="none" stroke="#35434d"/>
<text x="34" y="42" fill="#a6f17b" font-family="monospace" font-size="13">/ PROJECT MAP</text>
<text x="34" y="66" fill="#8b9aa4" font-family="monospace" font-size="12">four problems · one engineering mindset</text>
<path d="M150 142H1050" fill="none" stroke="url(#accent)" stroke-width="2" opacity=".85"/>
<circle cx="150" cy="142" r="5" fill="#a6f17b"/><circle cx="450" cy="142" r="5" fill="#4ac6b7"/><circle cx="750" cy="142" r="5" fill="#a6f17b"/><circle cx="1050" cy="142" r="5" fill="#4ac6b7"/>
<g font-family="monospace">
  <rect x="30" y="92" width="270" height="78" rx="8" fill="#172129" stroke="#385344"/>
  <text x="48" y="119" fill="#a6f17b" font-size="13">01 / RETRIEVAL</text>
  <text x="48" y="144" fill="#eef5f3" font-size="18" font-weight="700">MediBot RAG</text>
  <text x="48" y="160" fill="#8b9aa4" font-size="11">ground answers in documents</text>
  <rect x="330" y="92" width="270" height="78" rx="8" fill="#172129" stroke="#385344"/>
  <text x="348" y="119" fill="#4ac6b7" font-size="13">02 / INTERPRETABILITY</text>
  <text x="348" y="144" fill="#eef5f3" font-size="18" font-weight="700">LoanRisk AI</text>
  <text x="348" y="160" fill="#8b9aa4" font-size="11">explain the prediction</text>
  <rect x="630" y="92" width="270" height="78" rx="8" fill="#172129" stroke="#385344"/>
  <text x="648" y="119" fill="#a6f17b" font-size="13">03 / ACCESS CONTROL</text>
  <text x="648" y="144" fill="#eef5f3" font-size="18" font-weight="700">AccessGuard</text>
  <text x="648" y="160" fill="#8b9aa4" font-size="11">make permissions manageable</text>
  <rect x="930" y="92" width="240" height="78" rx="8" fill="#172129" stroke="#385344"/>
  <text x="948" y="119" fill="#4ac6b7" font-size="13">04 / UNCERTAINTY</text>
  <text x="948" y="144" fill="#eef5f3" font-size="18" font-weight="700">Fake News NLP</text>
  <text x="948" y="160" fill="#8b9aa4" font-size="11">don't fake certainty</text>
</g>
<rect x="30" y="205" width="1140" height="57" rx="8" fill="#111a22" stroke="#35434d"/>
<text x="600" y="229" fill="#eef5f3" font-family="monospace" font-size="14" text-anchor="middle">EVIDENCE → INTERPRETABILITY → DEPENDABLE BEHAVIOUR</text>
<text x="600" y="247" fill="#8b9aa4" font-family="monospace" font-size="11" text-anchor="middle">the model is one component; the system is the work</text>
</svg>